# Example nginx site (e.g. /etc/nginx/sites-available/sm64) in front of sm64-relay on 127.0.0.1:8080.
# Replace sm64.example.com and the certificate paths (certbot --nginx can fill them in).
# The relay serves /ws as a WebSocket, so the Upgrade headers are required.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name sm64.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name sm64.example.com;

    ssl_certificate     /etc/letsencrypt/live/sm64.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sm64.example.com/privkey.pem;

    # The relay sends files uncompressed; the .wasm is ~32 MB raw, ~7 MB gzipped.
    gzip on;
    gzip_types text/javascript application/wasm application/octet-stream application/json text/css;
    client_max_body_size 4m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
    }
}
